<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../../index.css">
    <title>Document</title>
    <script src="../auth.js" defer></script>
</head>
<body>
    <section class="flex h-screen shadow-xl">
        <div class="w-1/2 h-full rounded-2xl flex flex-col justify-center px-[136px] space-y-12 z-10">
            <div class="space-y-6">
                <h1 class="font-bold text-3xl">Register</h1>
                <p class="text-sm">Lengkapi informasi kredensial dan data diri di bawah ini untuk mulai <br>menggunakan layanan kami.</p>
            </div>
            <form id="register-form" class="space-y-12">
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1">
                            <label for="first_name" class="font-bold">First Name</label>
                            <input type="text" id="first_name" placeholder="Masukkan nama depan" class="border rounded-lg py-1 px-2">

                            <p id="first-name-error" class="text-red-500 text-xs hidden">First name tidak boleh kosong!</p>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label for="last_name" class="font-bold">Last Name</label>
                            <input type="text" id="last_name" placeholder="Masukkan nama belakang (opsional)" class="border rounded-lg py-1 px-2">
                        </div>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="email" class="font-bold">Email</label>
                        <input type="text" id="email" placeholder="example@gmail.com" class="border rounded-lg py-1 px-2">
    
                        <p id="email-error" class="text-red-500 text-xs hidden">Email tidak boleh kosong!</p>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="password" class="font-bold">Password</label>
                        <input type="password" id="password" placeholder="*******" class="border rounded-lg py-1 px-2">
    
                        <p id="password-error" class="text-red-500 text-xs hidden">Password tidak boleh kosong!</p>
                        <p id="password-notSame" class="text-red-500 text-xs hidden">Password tidak sama!</p>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="confirm_password" class="font-bold">Confirm Password</label>
                        <input type="password" id="confirm_password" placeholder="*******" class="border rounded-lg py-1 px-2">
    
                        <p id="reEnterPassword-error" class="text-red-500 text-xs hidden">Password tidak boleh kosong!</p>
                        <p id="reEnterPassword-notSame" class="text-red-500 text-xs hidden">Password tidak sama!</p>
                    </div>
                </div>
                <div class="flex flex-col gap-4">
                    <button type="submit" class="border bg-[#0080FF] text-white hover:bg-[#005DBB] rounded-lg py-1 cursor-pointer">Register</button>
                    <button type="button" onclick="window.location.href='../login/login.html'" class="border text-[#0080FF] hover:bg-[#EFEFEF] rounded-lg py-1 cursor-pointer">Login</button>
                </div>
            </form>
        </div>
        <div class="w-1/2 h-full">
            <img src="../../image/logimage.svg" alt="" class="w-full h-full object-cover">
        </div>
    </section>
</body>
</html>
