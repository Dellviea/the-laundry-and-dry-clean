<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../../index.css">
    <title>Document</title>
    <script src="../auth.js" defer></script>
</head>
<body>
    <section class="flex h-screen shadow-xl">
        <div class="w-1/2 h-full rounded-2xl flex flex-col justify-center px-[136px] space-y-16 z-10">
            <div class="space-y-6">
                <h1 class="font-bold text-3xl">Login</h1>
                <p class="text-sm">Masuk sekarang buat pesan layanan laundry kilat tanpa ribet. <br>Waktumu terlalu berharga untuk memcuci baju</p>
            </div>
            <form id="login-form" class="space-y-16">
                <div class="space-y-4">
                    <div class="flex flex-col gap-1">
                        <label for="email" class="font-bold">Email</label>
                        <input type="text" id="email" placeholder="example@gmail.com" class="border rounded-lg py-1 px-2">
    
                        <p id="email-error" class="text-red-500 text-xs hidden">Email tidak boleh kosong!</p>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="password" class="font-bold">Password</label>
                        <input type="password" id="password" placeholder="*******" class="border rounded-lg py-1 px-2">
    
                        <p id="password-error" class="text-red-500 text-xs hidden">Password tidak boleh kosong!</p>
                    </div>
                </div>
                <div class="flex flex-col gap-4">
                    <button type="submit" class="bg-[#0080FF] hover:bg-[#005DBB] text-white rounded-lg py-1 cursor-pointer">Login</button>
                    <button type="button" onclick="window.location.href='../register/register.html'" class="border text-[#0080FF] hover:bg-[#EFEFEF] rounded-lg py-1 cursor-pointer">Register</button>
                    <button type="button" onclick="window.location.href='forgotpass.html'" class="border text-[#CE0000] hover:bg-[#EFEFEF] rounded-lg py-1 cursor-pointer">Forgot Password</button>
                </div>
            </form>
        </div>
        <div class="w-1/2 h-full">
            <img src="../../image/logimage.svg" alt="" class="w-full h-full object-cover">
        </div>
    </section>
</body>
</html>
