<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../index.css">
    <script src="../handlers/ui_actions.js" defer></script>
    <script src="../handlers/customer_chat_handler.js" defer></script>
    <title>Chat Admin</title>
</head>
<body class="app-body min-h-screen m-0 text-[#4b4b4b] bg-gradient-to-b from-[#087de9] to-[#0063b7]">
    <header class="app-topbar h-[72px] bg-white flex items-center justify-between px-12">
        <a class="app-brand flex items-center gap-[18px] text-[#0080ff] no-underline [&_img]:h-10 [&_img]:w-10 [&_span]:font-bold [&_span]:text-2xl [&_span]:leading-none" href="home.html">
            <img src="../image/shirt.svg" alt="">
            <span>Laundry &amp; Dry Clean</span>
        </a>
        <button class="h-10 rounded-lg border border-[#0080ff] bg-white px-5 font-bold text-[#0080ff] cursor-pointer" type="button" data-logout>Log out</button>
    </header>

    <main>
        <h1 class="page-title text-white font-bold text-[56px] leading-none text-center my-[46px]">Chat Admin</h1>
        <div class="app-layout w-[calc(100%_-_64px)] max-w-[1540px] mx-auto mb-[74px] grid grid-cols-[250px_minmax(0,1fr)_250px] gap-[26px] items-start">
            <aside class="side-stack flex flex-col gap-[22px] sticky top-6 z-[5]">
                <button class="back-button w-full h-[50px] border-0 rounded-lg bg-[#df0000] text-white shadow-md flex items-center justify-center cursor-pointer [&_img]:h-[18px] [&_img]:w-[18px]" type="button" onclick="window.location.href='home.html'" aria-label="Back">
                    <img src="../icon/back.svg" alt="">
                </button>
            </aside>

            <section class="page-card bg-white rounded-lg overflow-hidden shadow-md admin-card py-6 px-7 pb-10">
                <h2 class="section-title font-bold text-[22px] leading-tight m-0 pb-1.5 border-b-2 border-[#0080ff]">Chat Dengan Admin</h2>
                <div id="customer-chat-thread" class="message-thread flex flex-col gap-3 mt-5 max-h-[440px] overflow-y-auto pr-1">
                    <div class="message-bubble max-w-[74%] rounded-lg py-3.5 px-4 leading-snug customer self-end bg-[#d8ebff] text-[#064d93]">Halo admin, apakah pesanan ORD-070526 bisa dijemput sore ini?</div>
                    <div class="message-bubble max-w-[74%] rounded-lg py-3.5 px-4 leading-snug admin self-start bg-[#f7f7f7] border border-[#e0e0e0]">Bisa, pickup tersedia pukul 16.00 sampai 18.00.</div>
                    <div class="message-bubble max-w-[74%] rounded-lg py-3.5 px-4 leading-snug customer self-end bg-[#d8ebff] text-[#064d93]">Baik, saya pilih pukul 17.00.</div>
                </div>
                <form id="customer-chat-form" class="chat-reply-box grid grid-cols-[minmax(0,1fr)_auto] gap-3 mt-5 [&_textarea]:min-h-[72px] [&_textarea]:border [&_textarea]:border-[#bdbdbd] [&_textarea]:rounded-lg [&_textarea]:py-3 [&_textarea]:px-3.5 [&_textarea]:resize-y">
                    <textarea id="customer-chat-message" placeholder="Tulis pesan untuk admin"></textarea>
                    <button class="primary-action h-12 border-0 rounded-lg bg-[#0080ff] text-white font-bold text-base px-7 cursor-pointer shadow-md" type="submit">Kirim Pesan</button>
                </form>
            </section>

            <nav class="app-nav flex flex-col gap-2.5 sticky top-6 z-[5] max-h-[calc(100vh-48px)] overflow-y-auto pr-0.5" aria-label="Customer navigation">
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="pemesanan.html">Pemesanan</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="riwayat-pemesanan.html">Riwayat Pesanan</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md is-active !bg-[#0080ff] !text-white !border-white" href="chat-admin.html">Chat Admin</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="kelola-akun.html">Kelola Akun</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="review-order.html">Review Order</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="complaint-order.html">Complaint Order</a>
            </nav>
        </div>
    </main>
</body>
</html>
