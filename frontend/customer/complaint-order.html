<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../index.css">
    <script src="../handlers/ui_actions.js" defer></script>
    <script src="../handlers/complaint_handler.js" defer></script>
    <title>Complaint Order</title>
</head>
<body class="app-body min-h-screen m-0 text-[#4b4b4b] bg-gradient-to-b from-[#087de9] to-[#0063b7]">
    <header class="app-topbar h-[72px] bg-white flex items-center justify-between px-12">
        <a class="app-brand flex items-center gap-[18px] text-[#0080ff] no-underline [&_img]:h-10 [&_img]:w-10 [&_span]:font-bold [&_span]:text-2xl [&_span]:leading-none" href="home.html">
            <img src="../image/shirt.svg" alt="">
            <span>Laundry &amp; Dry Clean</span>
        </a>
        <button class="h-10 rounded-lg border border-[#0080ff] bg-white px-5 font-bold text-[#0080ff] cursor-pointer" type="button" data-logout>Log out</button>
    </header>

    <main>
        <h1 class="page-title text-white font-bold text-[56px] leading-none text-center my-[46px]">Complaint Order</h1>

        <div class="app-layout w-[calc(100%_-_64px)] max-w-[1540px] mx-auto mb-[74px] grid grid-cols-[250px_minmax(0,1fr)_250px] gap-[26px] items-start">
            <aside class="side-stack flex flex-col gap-[22px] sticky top-6 z-[5]">
                <button class="back-button w-full h-[50px] border-0 rounded-lg bg-[#df0000] text-white shadow-md flex items-center justify-center cursor-pointer [&_img]:h-[18px] [&_img]:w-[18px]" type="button" onclick="window.location.href='home.html'" aria-label="Back">
                    <img src="../icon/back.svg" alt="">
                </button>
            </aside>

            <section class="page-card bg-white rounded-lg overflow-hidden shadow-md complaint-card pt-[30px] px-[26px] pb-[42px]">
                <h2 class="section-title font-bold text-[22px] leading-tight m-0 pb-1.5 border-b-2 border-[#0080ff]">Complaint Form</h2>

                <div class="complaint-note bg-[#f7f7f7] rounded-lg p-[18px] mt-5 border-l-4 border-[#0080ff]">
                    <strong class="item-title font-semibold text-base">Order terakhir</strong>
                    <div class="history-title flex items-start gap-4 [&_img]:h-[42px] [&_img]:w-[42px] mt-3.5">
                        <img src="../image/shirt.svg" alt="">
                        <div>
                            <div class="history-date font-semibold text-[15px]">Kamis 7 Mei 2026</div>
                            <div class="price-text text-[#0080ff] font-bold text-xs">Cuci Regular 2kg, Setrika 2kg - Rp.19.000</div>
                        </div>
                    </div>
                </div>

                <form id="complaint-form" class="complaint-grid grid grid-cols-2 gap-4 mt-[22px]" action="#" method="post">
                    <div class="form-field flex flex-col gap-2 mb-[18px] [&_label]:font-semibold [&_label]:text-[15px] [&_input]:w-full [&_input]:border [&_input]:border-[#bdbdbd] [&_input]:rounded-lg [&_input]:py-3.5 [&_input]:px-4 [&_select]:w-full [&_select]:border [&_select]:border-[#bdbdbd] [&_select]:rounded-lg [&_select]:py-3.5 [&_select]:px-4 [&_textarea]:w-full [&_textarea]:min-h-[140px] [&_textarea]:border [&_textarea]:border-[#bdbdbd] [&_textarea]:rounded-lg [&_textarea]:py-3.5 [&_textarea]:px-4 [&_textarea]:resize-y">
                        <label for="order-id">Pilih Pesanan</label>
                        <select id="order-id" name="order-id">
                            <option>ORD-070526 - Kamis 7 Mei 2026</option>
                            <option>ORD-050526 - Selasa 5 Mei 2026</option>
                            <option>ORD-030526 - Minggu 3 Mei 2026</option>
                        </select>
                    </div>

                    <div class="form-field flex flex-col gap-2 mb-[18px] [&_label]:font-semibold [&_label]:text-[15px] [&_input]:w-full [&_input]:border [&_input]:border-[#bdbdbd] [&_input]:rounded-lg [&_input]:py-3.5 [&_input]:px-4 [&_select]:w-full [&_select]:border [&_select]:border-[#bdbdbd] [&_select]:rounded-lg [&_select]:py-3.5 [&_select]:px-4 [&_textarea]:w-full [&_textarea]:min-h-[140px] [&_textarea]:border [&_textarea]:border-[#bdbdbd] [&_textarea]:rounded-lg [&_textarea]:py-3.5 [&_textarea]:px-4 [&_textarea]:resize-y">
                        <label for="complaint-type">Jenis Keluhan</label>
                        <select id="complaint-type" name="complaint-type">
                            <option>Pakaian belum selesai</option>
                            <option>Pakaian tertukar</option>
                            <option>Pakaian rusak</option>
                            <option>Tagihan tidak sesuai</option>
                            <option>Lainnya</option>
                        </select>
                    </div>

                    <div class="form-field flex flex-col gap-2 mb-[18px] [&_label]:font-semibold [&_label]:text-[15px]">
                        <label>Nama</label>
                        <div id="fixed-customer-name" class="w-full rounded-lg border border-[#e0e0e0] bg-[#f7f7f7] px-4 py-3.5 font-semibold text-[#4b4b4b]">-</div>
                        <input id="customer-name" name="customer-name" type="hidden">
                    </div>

                    <div class="form-field flex flex-col gap-2 mb-[18px] [&_label]:font-semibold [&_label]:text-[15px]">
                        <label>Email</label>
                        <div id="fixed-customer-email" class="w-full rounded-lg border border-[#e0e0e0] bg-[#f7f7f7] px-4 py-3.5 font-semibold text-[#4b4b4b]">-</div>
                        <input id="customer-email" name="customer-email" type="hidden">
                    </div>

                    <div class="form-field flex flex-col gap-2 mb-[18px] [&_label]:font-semibold [&_label]:text-[15px] [&_input]:w-full [&_input]:border [&_input]:border-[#bdbdbd] [&_input]:rounded-lg [&_input]:py-3.5 [&_input]:px-4 [&_select]:w-full [&_select]:border [&_select]:border-[#bdbdbd] [&_select]:rounded-lg [&_select]:py-3.5 [&_select]:px-4 [&_textarea]:w-full [&_textarea]:min-h-[140px] [&_textarea]:border [&_textarea]:border-[#bdbdbd] [&_textarea]:rounded-lg [&_textarea]:py-3.5 [&_textarea]:px-4 [&_textarea]:resize-y full col-span-full">
                        <label for="complaint-detail">Detail Keluhan</label>
                        <textarea id="complaint-detail" name="complaint-detail" placeholder="Tuliskan detail keluhan pesanan anda"></textarea>
                    </div>

                    <div class="form-field flex flex-col gap-2 mb-[18px] [&_label]:font-semibold [&_label]:text-[15px] [&_input]:w-full [&_input]:border [&_input]:border-[#bdbdbd] [&_input]:rounded-lg [&_input]:py-3.5 [&_input]:px-4 [&_select]:w-full [&_select]:border [&_select]:border-[#bdbdbd] [&_select]:rounded-lg [&_select]:py-3.5 [&_select]:px-4 [&_textarea]:w-full [&_textarea]:min-h-[140px] [&_textarea]:border [&_textarea]:border-[#bdbdbd] [&_textarea]:rounded-lg [&_textarea]:py-3.5 [&_textarea]:px-4 [&_textarea]:resize-y full col-span-full">
                        <label for="complaint-proof-input">Bukti Foto</label>
                        <label for="complaint-proof-input" class="min-h-[108px] border border-dashed border-[#9f9f9f] rounded-lg bg-[#f7f7f7] flex flex-col items-center justify-center gap-2 text-[#707070] text-center p-5 cursor-pointer">
                            <span class="font-semibold text-[#0080ff]">Upload bukti foto jika diperlukan</span>
                            <span class="text-sm">Format JPG, PNG, atau WEBP. Maksimal 2MB.</span>
                        </label>
                        <input id="complaint-proof-input" class="hidden" type="file" accept="image/png,image/jpeg,image/webp">
                        <div id="complaint-proof-preview" class="hidden items-center gap-4 rounded-lg border border-[#e0e0e0] bg-white p-3">
                            <img class="h-20 w-20 rounded-lg object-cover" alt="Preview bukti complaint">
                            <div class="min-w-0">
                                <div id="complaint-proof-name" class="truncate font-semibold text-[#4b4b4b]"></div>
                                <button id="complaint-proof-remove" class="mt-2 h-9 rounded-lg border border-[#df0000] bg-white px-4 font-bold text-[#df0000] cursor-pointer" type="button">Hapus Foto</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-field flex flex-col gap-2 mb-[18px] [&_label]:font-semibold [&_label]:text-[15px] [&_input]:w-full [&_input]:border [&_input]:border-[#bdbdbd] [&_input]:rounded-lg [&_input]:py-3.5 [&_input]:px-4 [&_select]:w-full [&_select]:border [&_select]:border-[#bdbdbd] [&_select]:rounded-lg [&_select]:py-3.5 [&_select]:px-4 [&_textarea]:w-full [&_textarea]:min-h-[140px] [&_textarea]:border [&_textarea]:border-[#bdbdbd] [&_textarea]:rounded-lg [&_textarea]:py-3.5 [&_textarea]:px-4 [&_textarea]:resize-y full col-span-full items-end">
                        <button class="primary-action h-12 border-0 rounded-lg bg-[#0080ff] text-white font-bold text-base px-7 cursor-pointer shadow-md" type="submit">Kirim Complaint</button>
                    </div>
                </form>
            </section>

            <nav class="app-nav flex flex-col gap-2.5 sticky top-6 z-[5] max-h-[calc(100vh-48px)] overflow-y-auto pr-0.5" aria-label="Order navigation">
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="pemesanan.html">Pemesanan</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="riwayat-pemesanan.html">Riwayat Pesanan</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="chat-admin.html">Chat Admin</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="kelola-akun.html">Kelola Akun</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="review-order.html">Review Order</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md is-active !bg-[#0080ff] !text-white !border-white" href="complaint-order.html">Complaint Order</a>
            </nav>
        </div>
    </main>
</body>
</html>
