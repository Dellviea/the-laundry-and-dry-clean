<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="handlers/order_handler.js" defer></script>
    <title>Pemesanan</title>
</head>
<body class="app-body">
    <header class="app-topbar">
        <a class="app-brand" href="loggedin.html">
            <img src="image/shirt.svg" alt="">
            <span>Laundry &amp; Dry Clean</span>
        </a>
        <button class="profile-dot" type="button" onclick="window.location.href='admin-analytics.html'" aria-label="Switch to admin"></button>
    </header>

    <main>
        <h1 class="page-title">Pemesanan</h1>

        <div class="app-layout">
            <aside class="side-stack">
                <button class="back-button" type="button" onclick="window.location.href='loggedin.html'" aria-label="Back">
                    <img src="icon/back.svg" alt="">
                </button>
            </aside>

            <section class="page-card">
                <div class="section-block">
                    <h2 class="section-title">Pilih Layanan</h2>
                    <div class="service-grid" id="service-grid">
                        <button class="service-card" type="button" data-service="express" data-title="Cuci Express" data-price="8000">
                            <img src="image/shirt.svg" alt="">
                            <strong>Cuci Express</strong>
                            <span class="price-text">Rp.8.000/kg</span>
                        </button>
                        <button class="service-card is-selected" type="button" data-service="regular" data-title="Cuci Regular" data-price="5000">
                            <img src="image/shirt.svg" alt="">
                            <strong>Cuci Regular</strong>
                            <span class="price-text">Rp.5.000/kg</span>
                        </button>
                        <button class="service-card" type="button" data-service="gaun" data-title="Dry Clean Gaun" data-price="30000">
                            <img src="image/shirt.svg" alt="">
                            <strong>Dry Clean Gaun</strong>
                            <span class="price-text">Rp.30.000/kg</span>
                        </button>
                        <button class="service-card" type="button" data-service="jas" data-title="Dry Clean Jas" data-price="25000">
                            <img src="image/shirt.svg" alt="">
                            <strong>Dry Clean Jas</strong>
                            <span class="price-text">Rp.25.000/kg</span>
                        </button>
                        <button class="service-card is-selected" type="button" data-service="setrika" data-title="Setrika" data-price="3000">
                            <img src="image/shirt.svg" alt="">
                            <strong>Setrika</strong>
                            <span class="price-text">Rp.3.000/kg</span>
                        </button>
                    </div>
                </div>

                <div class="section-block">
                    <h2 class="section-title">Item Pesanan</h2>
                    <div class="order-items" id="item"></div>
                </div>

                <div class="section-block">
                    <h2 class="section-title">Metode Pengambilan</h2>
                    <div class="option-grid">
                        <label class="option-box">
                            <input type="radio" name="pickup-method" id="pickup" value="3000" checked>
                            <span class="option-copy">
                                <strong>Pickup Service</strong>
                                <span>Pesanan akan diambil dari tempat anda</span>
                                <span class="price-text">Rp.3.000</span>
                            </span>
                        </label>
                        <label class="option-box">
                            <input type="radio" name="pickup-method" id="self" value="0">
                            <span class="option-copy">
                                <strong>Self Service</strong>
                                <span>Anda mengantar Laundry anda</span>
                                <span class="price-text">Free</span>
                            </span>
                        </label>
                    </div>
                </div>

                <div class="section-block">
                    <h2 class="section-title">Pengingat</h2>
                    <div class="option-grid">
                        <label class="option-box">
                            <input type="radio" name="reminder" id="registered-email" checked>
                            <span class="option-copy">
                                <strong>Gunakan Email terdaftar</strong>
                                <span>Notifikasi Laundry anda akan dikirimkan ke email saat anda mendaftar</span>
                            </span>
                        </label>
                        <label class="option-box">
                            <input type="radio" name="reminder" id="custom-email">
                            <span class="option-copy">
                                <strong>Custom Email</strong>
                                <span>Notifikasi Laundry anda akan dikirimkan ke email yang anda isi</span>
                            </span>
                        </label>
                    </div>
                    <div class="custom-email-panel" id="custom-email-panel">
                        <label for="custom-email-input">Email notifikasi</label>
                        <input id="custom-email-input" type="email" placeholder="example@gmail.com">
                    </div>
                </div>

                <div class="section-block">
                    <h2 class="section-title">Detail Transaksi</h2>
                    <div class="summary-box">
                        <div class="summary-line">
                            <span>Total Pesanan</span>
                            <span class="amount" id="subtotal">Rp.16.000</span>
                        </div>
                        <div class="summary-line">
                            <span>Pickup Service</span>
                            <span class="amount" id="pickup-total">Rp.3.000</span>
                        </div>
                        <hr class="summary-rule">
                        <div class="summary-line">
                            <strong>Total</strong>
                            <span class="amount" id="grand-total">Rp.19.000</span>
                        </div>
                    </div>
                </div>

                <div class="section-block">
                    <h2 class="section-title">Pembayaran</h2>
                    <div class="option-grid">
                        <label class="option-box payment-box" id="qris-option">
                            <input type="radio" name="payment" id="qris-payment" checked>
                            <span class="option-copy">
                                <strong>QRIS</strong>
                                <span>Bayar menggunakan QR Code</span>
                            </span>
                            <img class="payment-icon" src="image/Qris.svg" alt="">
                        </label>
                        <label class="option-box payment-box">
                            <input type="radio" name="payment" id="cashier-payment">
                            <span class="option-copy">
                                <strong>Bayar di Kasir</strong>
                                <span>Bayar di tempat Laundry</span>
                            </span>
                            <img class="payment-icon" src="image/machine.svg" alt="">
                        </label>
                    </div>
                </div>

                <div class="section-block submit-section">
                    <button class="primary-action order-submit-button" id="submit-order" type="button">Submit Pemesanan</button>
                </div>
            </section>

            <nav class="app-nav" aria-label="Order navigation">
                <a class="nav-button is-active" href="pemesanan.html">Pemesanan</a>
                <a class="nav-button" href="riwayat-pemesanan.html">Riwayat Pesanan</a>
                <a class="nav-button" href="chat-admin.html">Chat Admin</a>
                <a class="nav-button" href="kelola-akun.html">Kelola Akun</a>
                <a class="nav-button" href="review-order.html">Review Order</a>
                <a class="nav-button" href="complaint-order.html">Complaint Order</a>
            </nav>
        </div>
    </main>
</body>
</html>
