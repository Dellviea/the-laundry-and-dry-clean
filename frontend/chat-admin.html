<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="handlers/ui_actions.js" defer></script>
    <title>Chat Admin</title>
</head>
<body class="app-body">
    <header class="app-topbar">
        <a class="app-brand" href="loggedin.html">
            <img src="image/shirt.svg" alt="">
            <span>Laundry &amp; Dry Clean</span>
        </a>
        <button class="profile-dot" type="button" onclick="window.location.href='admin-analytics.html'" aria-label="Switch to admin"></button>
    </header>

    <main>
        <h1 class="page-title">Chat Admin</h1>
        <div class="app-layout">
            <aside class="side-stack">
                <button class="back-button" type="button" onclick="window.location.href='loggedin.html'" aria-label="Back">
                    <img src="icon/back.svg" alt="">
                </button>
            </aside>

            <section class="page-card admin-card">
                <h2 class="section-title">Chat Dengan Admin</h2>
                <div class="message-thread">
                    <div class="message-bubble customer">Halo admin, apakah pesanan ORD-070526 bisa dijemput sore ini?</div>
                    <div class="message-bubble admin">Bisa, pickup tersedia pukul 16.00 sampai 18.00.</div>
                    <div class="message-bubble customer">Baik, saya pilih pukul 17.00.</div>
                </div>
                <form class="chat-reply-box" data-demo-form data-success="Pesan berhasil dikirim ke admin.">
                    <textarea placeholder="Tulis pesan untuk admin"></textarea>
                    <button class="primary-action" type="submit">Kirim Pesan</button>
                </form>
            </section>

            <nav class="app-nav" aria-label="Customer navigation">
                <a class="nav-button" href="pemesanan.html">Pemesanan</a>
                <a class="nav-button" href="riwayat-pemesanan.html">Riwayat Pesanan</a>
                <a class="nav-button is-active" href="chat-admin.html">Chat Admin</a>
                <a class="nav-button" href="kelola-akun.html">Kelola Akun</a>
                <a class="nav-button" href="review-order.html">Review Order</a>
                <a class="nav-button" href="complaint-order.html">Complaint Order</a>
            </nav>
        </div>
    </main>
</body>
</html>
