<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="handlers/ui_actions.js" defer></script>
    <title>Update Status</title>
</head>
<body class="app-body">
    <header class="app-topbar">
        <a class="app-brand" href="admin-analytics.html">
            <img src="image/shirt.svg" alt="">
            <span>Laundry &amp; Dry Clean</span>
        </a>
        <button class="profile-dot" type="button" onclick="window.location.href='loggedin.html'" aria-label="Switch to customer"></button>
    </header>

    <main>
        <h1 class="page-title">Update Status</h1>
        <div class="app-layout">
            <aside class="side-stack">
                <button class="back-button" type="button" onclick="window.location.href='admin-orders.html'" aria-label="Back">
                    <img src="icon/back.svg" alt="">
                </button>
            </aside>

            <section class="page-card admin-card">
                <h2 class="section-title">Update Status Pesanan</h2>
                <form class="complaint-grid" data-demo-form data-success="Status pesanan berhasil diperbarui sementara.">
                    <div class="form-field">
                        <label for="status-order">Pilih Pesanan</label>
                        <select id="status-order">
                            <option>ORD-070526 - Dipesan</option>
                            <option>ORD-050526 - Diproses</option>
                            <option>ORD-030526 - Dikirim</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="status-next">Status Baru</label>
                        <select id="status-next">
                            <option>Dijemput</option>
                            <option>Dicuci</option>
                            <option>Dikirim</option>
                            <option>Selesai</option>
                            <option>Dibatalkan</option>
                        </select>
                    </div>
                    <div class="form-field full">
                        <label for="status-note">Catatan Admin</label>
                        <textarea id="status-note" placeholder="Tambahkan catatan status"></textarea>
                    </div>
                    <div class="form-field full" style="align-items: flex-end;">
                        <button class="primary-action" type="submit">Update Status</button>
                    </div>
                </form>
                <div class="admin-panel-body">
                    <table class="admin-table">
                        <thead><tr><th>ID</th><th>Customer</th><th>Status Saat Ini</th><th>Aksi Cepat</th></tr></thead>
                        <tbody>
                            <tr><td>ORD-070526</td><td>Della Oktavia</td><td><span class="admin-status status-pending">Dipesan</span></td><td><button class="admin-mini-action" type="button" data-popup="ORD-070526 diubah menjadi Dijemput.">Dijemput</button></td></tr>
                            <tr><td>ORD-050526</td><td>Syahrial Affansyah</td><td><span class="admin-status status-process">Diproses</span></td><td><button class="admin-mini-action" type="button" data-popup="ORD-050526 diubah menjadi Dikirim.">Dikirim</button></td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <nav class="app-nav" aria-label="Admin navigation">
                <a class="nav-button" href="admin-analytics.html">Dashboard</a>
                <a class="nav-button" href="admin-orders.html">Daftar Pesanan</a>
                <a class="nav-button" href="admin-order-detail.html">Detail Pesanan</a>
                <a class="nav-button" href="admin-approval.html">Approve Order</a>
                <a class="nav-button is-active" href="admin-status.html">Update Status</a>
                <a class="nav-button" href="admin-delivery.html">Confirm Delivery</a>
                <a class="nav-button" href="admin-laundry-data.html">Data Laundry</a>
                <a class="nav-button" href="admin-chat.html">Chat Customers</a>
                <a class="nav-button" href="admin-reviews.html">Reviews</a>
                <a class="nav-button" href="admin-complaints.html">Complaints</a>
            </nav>
        </div>
    </main>
</body>
</html>
