<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../index.css">
    <script src="../handlers/ui_actions.js" defer></script>
    <title>Update Status</title>
</head>
<body class="app-body min-h-screen m-0 text-[#4b4b4b] bg-gradient-to-b from-[#087de9] to-[#0063b7]">
    <header class="app-topbar h-[72px] bg-white flex items-center justify-between px-12">
        <a class="app-brand flex items-center gap-[18px] text-[#0080ff] no-underline [&_img]:h-10 [&_img]:w-10 [&_span]:font-bold [&_span]:text-2xl [&_span]:leading-none" href="analytics.html">
            <img src="../image/shirt.svg" alt="">
            <span>Laundry &amp; Dry Clean</span>
        </a>
        <button class="profile-dot w-[42px] h-[42px] border border-[#0080ff] rounded-full bg-white cursor-pointer" type="button" onclick="window.location.href='../customer/home.html'" aria-label="Switch to customer"></button>
    </header>

    <main>
        <h1 class="page-title text-white font-bold text-[56px] leading-none text-center my-[46px]">Update Status</h1>
        <div class="app-layout w-[calc(100%_-_64px)] max-w-[1540px] mx-auto mb-[74px] grid grid-cols-[250px_minmax(0,1fr)_250px] gap-[26px] items-start">
            <aside class="side-stack flex flex-col gap-[22px] sticky top-6 z-[5]">
                <button class="back-button w-full h-[50px] border-0 rounded-lg bg-[#df0000] text-white shadow-md flex items-center justify-center cursor-pointer [&_img]:h-[18px] [&_img]:w-[18px]" type="button" onclick="window.location.href='orders.html'" aria-label="Back">
                    <img src="../icon/back.svg" alt="">
                </button>
            </aside>

            <section class="page-card bg-white rounded-lg overflow-hidden shadow-md admin-card py-6 px-7 pb-10">
                <h2 class="section-title font-bold text-[22px] leading-tight m-0 pb-1.5 border-b-2 border-[#0080ff]">Update Status Pesanan</h2>
                <form class="complaint-grid grid grid-cols-2 gap-4 mt-[22px]" data-demo-form data-success="Status pesanan berhasil diperbarui sementara.">
                    <div class="form-field flex flex-col gap-2 mb-[18px] [&_label]:font-semibold [&_label]:text-[15px] [&_input]:w-full [&_input]:border [&_input]:border-[#bdbdbd] [&_input]:rounded-lg [&_input]:py-3.5 [&_input]:px-4 [&_select]:w-full [&_select]:border [&_select]:border-[#bdbdbd] [&_select]:rounded-lg [&_select]:py-3.5 [&_select]:px-4 [&_textarea]:w-full [&_textarea]:min-h-[140px] [&_textarea]:border [&_textarea]:border-[#bdbdbd] [&_textarea]:rounded-lg [&_textarea]:py-3.5 [&_textarea]:px-4 [&_textarea]:resize-y">
                        <label for="status-order">Pilih Pesanan</label>
                        <select id="status-order">
                            <option>ORD-070526 - Dipesan</option>
                            <option>ORD-050526 - Diproses</option>
                            <option>ORD-030526 - Dikirim</option>
                        </select>
                    </div>
                    <div class="form-field flex flex-col gap-2 mb-[18px] [&_label]:font-semibold [&_label]:text-[15px] [&_input]:w-full [&_input]:border [&_input]:border-[#bdbdbd] [&_input]:rounded-lg [&_input]:py-3.5 [&_input]:px-4 [&_select]:w-full [&_select]:border [&_select]:border-[#bdbdbd] [&_select]:rounded-lg [&_select]:py-3.5 [&_select]:px-4 [&_textarea]:w-full [&_textarea]:min-h-[140px] [&_textarea]:border [&_textarea]:border-[#bdbdbd] [&_textarea]:rounded-lg [&_textarea]:py-3.5 [&_textarea]:px-4 [&_textarea]:resize-y">
                        <label for="status-next">Status Baru</label>
                        <select id="status-next">
                            <option>Dijemput</option>
                            <option>Dicuci</option>
                            <option>Dikirim</option>
                            <option>Selesai</option>
                            <option>Dibatalkan</option>
                        </select>
                    </div>
                    <div class="form-field flex flex-col gap-2 mb-[18px] [&_label]:font-semibold [&_label]:text-[15px] [&_input]:w-full [&_input]:border [&_input]:border-[#bdbdbd] [&_input]:rounded-lg [&_input]:py-3.5 [&_input]:px-4 [&_select]:w-full [&_select]:border [&_select]:border-[#bdbdbd] [&_select]:rounded-lg [&_select]:py-3.5 [&_select]:px-4 [&_textarea]:w-full [&_textarea]:min-h-[140px] [&_textarea]:border [&_textarea]:border-[#bdbdbd] [&_textarea]:rounded-lg [&_textarea]:py-3.5 [&_textarea]:px-4 [&_textarea]:resize-y full col-span-full">
                        <label for="status-note">Catatan Admin</label>
                        <textarea id="status-note" placeholder="Tambahkan catatan status"></textarea>
                    </div>
                    <div class="form-field flex flex-col gap-2 mb-[18px] [&_label]:font-semibold [&_label]:text-[15px] [&_input]:w-full [&_input]:border [&_input]:border-[#bdbdbd] [&_input]:rounded-lg [&_input]:py-3.5 [&_input]:px-4 [&_select]:w-full [&_select]:border [&_select]:border-[#bdbdbd] [&_select]:rounded-lg [&_select]:py-3.5 [&_select]:px-4 [&_textarea]:w-full [&_textarea]:min-h-[140px] [&_textarea]:border [&_textarea]:border-[#bdbdbd] [&_textarea]:rounded-lg [&_textarea]:py-3.5 [&_textarea]:px-4 [&_textarea]:resize-y full col-span-full items-end">
                        <button class="primary-action h-12 border-0 rounded-lg bg-[#0080ff] text-white font-bold text-base px-7 cursor-pointer shadow-md" type="submit">Update Status</button>
                    </div>
                </form>
                <div class="admin-panel-body mt-5 overflow-x-auto">
                    <table class="admin-table w-full border-collapse text-sm [&_th]:py-3.5 [&_th]:px-3 [&_th]:border-b [&_th]:border-[#e3e3e3] [&_th]:text-left [&_th]:align-middle [&_th]:text-[#0080ff] [&_th]:font-bold [&_th]:bg-[#f7f7f7] [&_td]:py-3.5 [&_td]:px-3 [&_td]:border-b [&_td]:border-[#e3e3e3] [&_td]:text-left [&_td]:align-middle">
                        <thead><tr><th>ID</th><th>Customer</th><th>Status Saat Ini</th><th>Aksi Cepat</th></tr></thead>
                        <tbody>
                            <tr><td>ORD-070526</td><td>Della Oktavia</td><td><span class="admin-status inline-flex min-w-28 h-7 rounded-lg items-center justify-center text-white font-bold text-xs status-pending bg-[#9d9823]">Dipesan</span></td><td><button class="admin-mini-action h-9 border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold px-4 cursor-pointer" type="button" data-popup="ORD-070526 diubah menjadi Dijemput.">Dijemput</button></td></tr>
                            <tr><td>ORD-050526</td><td>Syahrial Affansyah</td><td><span class="admin-status inline-flex min-w-28 h-7 rounded-lg items-center justify-center text-white font-bold text-xs status-process bg-[#2596a5]">Diproses</span></td><td><button class="admin-mini-action h-9 border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold px-4 cursor-pointer" type="button" data-popup="ORD-050526 diubah menjadi Dikirim.">Dikirim</button></td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <nav class="app-nav flex flex-col gap-2.5 sticky top-6 z-[5] max-h-[calc(100vh-48px)] overflow-y-auto pr-0.5" aria-label="Admin navigation">
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="analytics.html">Dashboard</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="orders.html">Daftar Pesanan</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="order-detail.html">Detail Pesanan</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="approval.html">Approve Order</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md is-active !bg-[#0080ff] !text-white !border-white" href="status.html">Update Status</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="delivery.html">Confirm Delivery</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="laundry-data.html">Data Laundry</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="chat.html">Chat Customers</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="reviews.html">Reviews</a>
                <a class="nav-button h-[50px] border border-[#0080ff] rounded-lg bg-white text-[#0080ff] font-bold text-[17px] no-underline flex items-center justify-center shadow-md" href="complaints.html">Complaints</a>
            </nav>
        </div>
    </main>
</body>
</html>
