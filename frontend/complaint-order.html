<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="handlers/ui_actions.js" defer></script>
    <title>Complaint Order</title>
</head>
<body class="app-body">
    <header class="app-topbar">
        <a class="app-brand" href="loggedin.html">
            <img src="image/shirt.svg" alt="">
            <span>Laundry &amp; Dry Clean</span>
        </a>
        <button class="profile-dot" type="button" onclick="window.location.href='admin-orders.html'" aria-label="Switch to admin"></button>
    </header>

    <main>
        <h1 class="page-title">Complaint Order</h1>

        <div class="app-layout">
            <aside class="side-stack">
                <button class="back-button" type="button" onclick="window.location.href='loggedin.html'" aria-label="Back">
                    <img src="icon/back.svg" alt="">
                </button>
            </aside>

            <section class="page-card complaint-card">
                <h2 class="section-title">Complaint Form</h2>

                <div class="complaint-note">
                    <strong class="item-title">Order terakhir</strong>
                    <div class="history-title" style="margin-top: 14px;">
                        <img src="image/shirt.svg" alt="">
                        <div>
                            <div class="history-date">Kamis 7 Mei 2026</div>
                            <div class="price-text">Cuci Regular 2kg, Setrika 2kg - Rp.19.000</div>
                        </div>
                    </div>
                </div>

                <form class="complaint-grid" action="#" method="post" data-demo-form data-success="Complaint berhasil dikirim. Admin akan menindaklanjuti keluhan anda.">
                    <div class="form-field">
                        <label for="order-id">Pilih Pesanan</label>
                        <select id="order-id" name="order-id">
                            <option>ORD-070526 - Kamis 7 Mei 2026</option>
                            <option>ORD-050526 - Selasa 5 Mei 2026</option>
                            <option>ORD-030526 - Minggu 3 Mei 2026</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="complaint-type">Jenis Keluhan</label>
                        <select id="complaint-type" name="complaint-type">
                            <option>Pakaian belum selesai</option>
                            <option>Pakaian tertukar</option>
                            <option>Pakaian rusak</option>
                            <option>Tagihan tidak sesuai</option>
                            <option>Lainnya</option>
                        </select>
                    </div>

                    <div class="form-field">
                        <label for="customer-name">Nama</label>
                        <input id="customer-name" name="customer-name" type="text" placeholder="Masukkan nama anda">
                    </div>

                    <div class="form-field">
                        <label for="customer-email">Email</label>
                        <input id="customer-email" name="customer-email" type="email" placeholder="example@gmail.com">
                    </div>

                    <div class="form-field full">
                        <label for="complaint-detail">Detail Keluhan</label>
                        <textarea id="complaint-detail" name="complaint-detail" placeholder="Tuliskan detail keluhan pesanan anda"></textarea>
                    </div>

                    <div class="form-field full">
                        <label>Bukti Foto</label>
                        <div class="upload-box">
                            Upload bukti foto jika diperlukan
                        </div>
                    </div>

                    <div class="form-field full" style="align-items: flex-end;">
                        <button class="primary-action" type="submit">Kirim Complaint</button>
                    </div>
                </form>
            </section>

            <nav class="app-nav" aria-label="Order navigation">
                <a class="nav-button" href="pemesanan.html">Pemesanan</a>
                <a class="nav-button" href="riwayat-pemesanan.html">Riwayat Pesanan</a>
                <a class="nav-button is-active" href="complaint-order.html">Complaint Order</a>
            </nav>
        </div>
    </main>
</body>
</html>
