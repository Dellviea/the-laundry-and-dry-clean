<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/index.css">
    <title>Document</title>
</head>
<body>
    <section class="flex h-screen shadow-xl ">
        <div class="w-1/2 h-full rounded-2xl flex flex-col justify-center px-34 space-y-16 z-10">
            <div class="space-y-6">
                <h1 class="title text-3xl">Login</h1>
                <p class="text-sm">Masuk sekarang buat pesan layanan laundry kilat tanpa ribet. <br>Waktumu terlalu berharga untuk memcuci baju</p>
            </div>
            <form action="submit" class="space-y-16">
                <div class="space-y-4">
                    <div class="flex flex-col gap-1">
                        <label for="email" class="title ">Email</label>
                        <input type="text" id="email" placeholder="example@gmail.com" class="border rounded-lg py-1 px-2">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label for="password" class="title">Password</label>
                        <input type="text" id="password" placeholder="*******" class="border rounded-lg py-1 px-2 ">
                    </div>
                </div>
                <div class="flex flex-col gap-4">
                    <button type="submit" class="bg-[#0080FF] hover:bg-[#005DBB] text-white rounded-lg py-1 cursor-pointer">Login</button>
                    <button type="button" onclick="window.location.href='/auth/register/register.html'" class="border text-[#0080FF] hover:bg-[#EFEFEF] rounded-lg py-1 cursor-pointer">Register</button>
                    <button type="button" onclick="window.location.href='/auth/login/forgotpass.html'" class="border text-[#CE0000] hover:bg-[#EFEFEF] rounded-lg py-1 cursor-pointer">Forgot Password</a></button>
                </div>
            </form>
        </div>
        <div class="w-1/2 h-full">
            <img src="/image/logimage.svg" alt="" class="w-full h-full object-cover">
        </div>
    </section>
</body>
</html>
